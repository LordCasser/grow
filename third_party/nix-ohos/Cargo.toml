[package]
edition = "2018"
rust-version = "1.56"
name = "nix"
version = "0.26.4"
authors = ["The nix-rust Project Developers"]
include = [
    "src/**/*",
    "test/**/*",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]
description = "Rust friendly bindings to *nix APIs"
readme = "README.md"
categories = ["os::unix-apis"]
license = "MIT"
repository = "https://github.com/nix-rust/nix"

[package.metadata.docs.rs]
rustdoc-args = [
    "--cfg",
    "docsrs",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-openbsd",
    "x86_64-unknown-netbsd",
    "x86_64-unknown-dragonfly",
    "x86_64-fuchsia",
    "x86_64-unknown-redox",
    "x86_64-unknown-illumos",
]

[[test]]
name = "test"
path = "test/test.rs"

[[test]]
name = "test-aio-drop"
path = "test/sys/test_aio_drop.rs"

[[test]]
name = "test-clearenv"
path = "test/test_clearenv.rs"

[[test]]
name = "test-mount"
path = "test/test_mount.rs"
harness = false

[[test]]
name = "test-ptymaster-drop"
path = "test/test_ptymaster_drop.rs"

[dependencies.bitflags]
version = "1.1"

[dependencies.cfg-if]
version = "1.0"

[dependencies.libc]
version = "0.2.137"
features = ["extra_traits"]

[dependencies.pin-utils]
version = "0.1.0"
optional = true

[dev-dependencies.assert-impl]
version = "0.1"

[dev-dependencies.lazy_static]
version = "1.4"

[dev-dependencies.parking_lot]
version = "0.12"

[dev-dependencies.rand]
version = "0.8"

[dev-dependencies.semver]
version = "1.0.7"

[dev-dependencies.tempfile]
version = "3.3"

[features]
acct = []
aio = ["pin-utils"]
default = [
    "acct",
    "aio",
    "dir",
    "env",
    "event",
    "feature",
    "fs",
    "hostname",
    "inotify",
    "ioctl",
    "kmod",
    "mman",
    "mount",
    "mqueue",
    "net",
    "personality",
    "poll",
    "process",
    "pthread",
    "ptrace",
    "quota",
    "reboot",
    "resource",
    "sched",
    "signal",
    "socket",
    "term",
    "time",
    "ucontext",
    "uio",
    "user",
    "zerocopy",
]
dir = ["fs"]
env = []
event = []
feature = []
fs = []
hostname = []
inotify = []
ioctl = []
kmod = []
mman = []
mount = ["uio"]
mqueue = ["fs"]
net = ["socket"]
personality = []
poll = []
process = []
pthread = []
ptrace = ["process"]
quota = []
reboot = []
resource = []
sched = ["process"]
signal = ["process"]
socket = ["memoffset"]
term = []
time = []
ucontext = ["signal"]
uio = []
user = ["feature"]
zerocopy = [
    "fs",
    "uio",
]

[target."cfg(any(target_os = \"android\", target_os = \"linux\"))".dev-dependencies.caps]
version = "0.5.3"

[target."cfg(not(target_os = \"redox\"))".dependencies.memoffset]
version = "0.7"
optional = true

[target."cfg(target_os = \"freebsd\")".dev-dependencies.sysctl]
version = "0.4"

# Local lint policy for this vendored copy; see VENDORING NOTES above.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fbsd14)'] }
