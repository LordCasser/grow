# 0.30 via workspace.dependencies.
# Local modifications:
#   src/sys/signal.rs: bare `extern fn` fn-pointer types rewritten as
#   `extern "C" fn` (rustc missing_abi lint; same fix upstream shipped in
#   0.28+), and an allow for unpredictable_function_pointer_comparisons on
#   the SigHandler derives (intentional upstream API; the lint fires on
#   rustc >= 1.83 in upstream nix 0.26..0.31 as well).
#   src/sys/statfs.rs: same missing_abi fix.
#   src/**: target_env="ohos" treated as musl in libc-gated cfg branches.
#   Cargo.toml: [lints.rust] check-cfg declares cfg(fbsd14), which upstream
#   uses for FreeBSD 14 doc blocks (unexpected_cfgs lint; upstream never
#   declared it).
# Upgrade checklist: once the workspace can drop nix ^0.26 (pprof bump or a
# 0.26-compatible nix), delete this patch and registry nix resolves natively
