# VENDORING NOTES
# Upstream: https://github.com/always-further/nono v0.53.0 (Apache-2.0),
# vendored because release targets need local portability patches.
# Version ceiling: v0.54.0 through the current v0.71.0 require Rust 1.95;
# this workspace is pinned to Rust 1.93.1, so v0.53.0 is the newest compatible
# release. Do not lower a newer release's declared rust-version to force it in.
# Local patches:
#   src/sandbox/linux.rs: add SYS_OPENAT/SYS_OPENAT2 constants for
#   target_arch = "riscv64" (asm-generic numbers 56/437, same as aarch64).
#   Upstream only defines them for x86_64/aarch64 while linux.rs uses them
#   unconditionally, so riscv64 fails to compile with E0425.
#   src/sandbox/linux.rs: type seccomp ioctl request literals as u32 before
#   casting to libc::Ioctl. That alias is c_int on musl and c_ulong on glibc;
#   untyped high-bit literals overflow i32 on both musl release targets.
#   src/trust/{bundle,signing}.rs + Cargo.toml: dropped the sigstore
#   verification/signing stack (sigstore-verify/sigstore-trust-root). Grow's
#   sandbox crate only uses nono's sandbox/landlock/seccomp surfaces, never
#   file attestation; removing it also drops the aws-lc-rs crypto chain
#   (sigstore-crypto) that otherwise drags a cmake-based C build into the
#   graph. trust/{base64,digest,dsse,policy,types}.rs are unaffected.
# Upgrade checklist: first re-check the workspace MSRV against the newest
# release, then re-copy upstream source. Re-apply the riscv64 block if upstream
# still supports only x86_64/aarch64. The ioctl literal fix is present on
# current upstream main but must remain while v0.53.0 is the compatible base.
# Confirm the license file matches `license =` in this manifest.
