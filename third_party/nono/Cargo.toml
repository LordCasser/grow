[package]
edition = "2021"
rust-version = "1.74"
name = "nono"
version = "0.53.0"
authors = ["Luke Hinds"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Capability-based sandboxing library using Landlock (Linux) and Seatbelt (macOS)"
homepage = "https://github.com/always-further/nono"
readme = "README.md"
keywords = [
    "sandbox",
    "security",
    "capability",
    "landlock",
    "seatbelt",
]
categories = [
    "os",
    "api-bindings",
]
license = "Apache-2.0"
repository = "https://github.com/always-further/nono"

[features]
default = ["system-keyring"]
system-keyring = ["dep:keyring"]

[lib]
name = "nono"
path = "src/lib.rs"

[[test]]
name = "capability_manifest_schema"
path = "tests/capability_manifest_schema.rs"

[[test]]
name = "manifest_types"
path = "tests/manifest_types.rs"

[dependencies.der]
version = "0.7"
default-features = false

[dependencies.getrandom]
version = "0.4"

[dependencies.globset]
version = "0.4"

[dependencies.ignore]
version = "0.4"

[dependencies.keyring]
version = "3"
optional = true

[dependencies.libc]
version = "0.2"

[dependencies.regress]
version = "0.11"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.149"
features = ["preserve_order"]

[dependencies.sha2]
version = "0.11"

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"

[dependencies.walkdir]
version = "2"

[dependencies.x509-cert]
version = "0.2"
default-features = false

[dependencies.zeroize]
version = "1"
features = ["alloc"]

[dev-dependencies.jsonschema]
version = "0.46"

[dev-dependencies.tempfile]
version = "3"

[build-dependencies.prettyplease]
version = "0.2"

[build-dependencies.serde_json]
version = "1"

[build-dependencies.syn]
version = "2"

[build-dependencies.typify]
version = "0.6"

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["sync-secret-service"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.landlock]
version = "0.4"

[target.'cfg(target_os = "linux")'.dependencies.nix]
version = "0.31.2"
features = [
    "fs",
    "user",
]

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]
optional = true

[target.'cfg(target_os = "macos")'.dependencies.nix]
version = "0.31.2"
features = [
    "fs",
    "user",
]
