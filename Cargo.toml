# Auto-generated workspace root. Prefer editing per-crate Cargo.toml files.

[patch.crates-io]
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }
# vendored in third_party/nono: adds the riscv64 syscall table that upstream
# 0.53.0 lacks (SYS_OPENAT/SYS_OPENAT2 are only defined for x86_64/aarch64);
# no effect on other targets. See third_party/nono/Cargo.toml for notes.
nono = { path = "third_party/nono" }

