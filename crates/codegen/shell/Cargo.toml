[package]
license = "Apache-2.0"
name = "shell"
version.workspace = true
edition.workspace = true

[features]
default = []
unstable = []
dhat-heap = ["dep:dhat"]
# Session synthesis + in-process e2e harness (`session::testkit`) for soak,
# load, and bench tests. Off by default; the tests/benches that use it declare
# it via `required-features`.
test-support = []
default-bazel = ["test-support"]

[dependencies]
dunce = { workspace = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
announcements = { workspace = true }
prompt-queue = { workspace = true }
version = { workspace = true }

async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
kanal = "0.1"
regex = { workspace = true }
# rmcp 2.1 + reqwest 0.13 are quarantined inside `mcp`. The remaining
# MCP code in this crate (extensions/mcp.rs, mcp_doctor.rs) reaches rmcp model
# types via `mcp::rmcp::model::*`. reqwest 0.13 is a private impl
# detail of mcp::servers; shell never sees it. Every HTTP call site
# in this crate uses workspace reqwest 0.12.
mcp = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
reqwest-middleware = { workspace = true }
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
# Bumped from 0.32 to resolve CVE-2025-29087, CVE-2025-3277, CVE-2025-6965.
# sqlite-vec is C ABI, not Rust-version dependent — any rusqlite with `bundled` works.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
similar = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
dirs = "6"
tokio-stream = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
obfstr = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
acp-transport = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8"
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = "0.15"
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
dhat = { workspace = true, optional = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
shlex = { workspace = true }
strum = { workspace = true }
fast-worktree = { path = "../fast-worktree", features = ["metadata"] }

paths = { path = "../paths" }
shell-base = { workspace = true }
shell-session-support = { workspace = true }
client-support = { workspace = true }
tracing-macros = { path = "../tracing-macros" }
fsnotify = { path = "../fsnotify" }
codebase-graph = { path = "../codebase-graph" }
hunk-tracker = { path = "../hunk-tracker" }
agent-lifecycle = { workspace = true }
sandbox = { path = "../sandbox", default-features = false }
chat-state = { path = "../chat-state" }
compaction = { path = "../../common/compaction" }
sampler = { path = "../sampler" }
sqlite-journal = { workspace = true }
token-estimation = { workspace = true }
sampling-types = { path = "../sampling-types" }
tools = { path = "../tools" }
tty-utils = { workspace = true }
workflow = { path = "../workflow" }
workspace = { workspace = true }
subagent-resolution = { path = "../subagent-resolution" }
agent = { path = "../agent" }
config = { workspace = true }
config-types = { workspace = true }
memory = { workspace = true }
hooks = { path = "../hooks" }
extension-types = { path = "../extension-types" }
plugin-marketplace = { path = "../plugin-marketplace" }
diagnostics = { workspace = true }
grow-http = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
flate2 = { workspace = true }
fs2 = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
process-wrap = { version = "9.0.0", features = ["tokio1", "job-object", "creation-flags"] }
portable-pty = "0.9"
parking_lot.workspace = true
dashmap.workspace = true

# Unified local tool dispatch shared by ACP sessions and MCP servers.
tool-runtime = { workspace = true }
tool-protocol = { workspace = true }
tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
siphasher = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
filetime = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
memory = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
config = { workspace = true, features = [] }
ring = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
rsa = { workspace = true }
semver = { workspace = true }
serial_test = { workspace = true }
# Pre-main unified-log redirect (`test_support::redirect_unified_log_for_tests`).
ctor = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
shell-base = { workspace = true, features = ["test-support"] }
test-support = { workspace = true, features = [] }
test-utils = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[dependencies.tempfile]
workspace = true

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "fork_copy"
harness = false
required-features = ["test-support"]

# Consume `session::testkit`, so they need the gate (on by default under Bazel).
[[test]]
name = "test_leader_soak"
required-features = ["test-support"]

[[test]]
name = "test_session_load_memory"
required-features = ["test-support"]

[[test]]
name = "session_fork_replay_memory"
required-features = ["test-support"]

[[test]]
name = "session_load_perf"
required-features = ["test-support"]

[[test]]
name = "testkit_synth_roundtrip"
required-features = ["test-support"]

[lints]
workspace = true
[[bin]]
name = "chat-history-downgrade"
path = "src/bin/chat-history-downgrade.rs"
