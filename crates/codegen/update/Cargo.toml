[package]
license = "Apache-2.0"
name = "update"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "process", "io-util", "macros", "time"] }
tracing = { workspace = true }
shell = { workspace = true }
tar = { workspace = true }
tools = { workspace = true }
version = { workspace = true }

[dev-dependencies]
semver = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }

[features]
# Package-manager-managed build (e.g. the Harmonybrew formula): disables
# self-update entirely — get_installer() returns None and the startup
# version-range block is skipped. Upgrades are the package manager's job.
distro-pm = []
