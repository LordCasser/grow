[package]
license = "Apache-2.0"
name = "update"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
dunce = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "process", "io-util", "macros", "time"] }
tracing = { workspace = true }
tty-utils = { workspace = true }
shell = { workspace = true }
tar = { workspace = true }
tools = { workspace = true }
version = { workspace = true }

[dev-dependencies]
semver = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path.
ctor = { workspace = true }
diagnostics = { workspace = true }

[features]
# Package-manager-managed downstream build: disables
# self-update entirely — get_installer() returns None and the startup
# version-range block is skipped. Upgrades are the package manager's job.
distro-pm = []
