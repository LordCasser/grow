[package]
license = "Apache-2.0"
name = "sqlite-journal"
version = "0.1.0"
edition.workspace = true
description = "Filesystem-aware SQLite journal-mode selection: WAL on local disks, rollback journal on network mounts where WAL's mmap'd -shm is unsafe"

[dependencies]
# Matches the pinned rusqlite of every consumer (bundled = self-contained SQLite).
# Keep the pre-0.40 default feature set (`cache`) while excluding its new
# WebAssembly-only SQLite FFI default; all consumers use the bundled native SQLite.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Same per-crate pin as crash-handler / pager
# (windows-sys has no workspace entry).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
