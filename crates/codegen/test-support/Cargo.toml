[package]
license = "Apache-2.0"
name = "test-support"
version.workspace = true
edition.workspace = true
description = "Shared test-support for grow-build crates: mock inference server, SSE generators, ACP stdio client, headless runner, env sandbox"
publish = false

[dependencies]
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
url = { workspace = true }
acp-transport = { workspace = true }
tty-utils = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path.
ctor = { workspace = true }
diagnostics = { workspace = true }
[features]
default = []
default-bazel = []

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
