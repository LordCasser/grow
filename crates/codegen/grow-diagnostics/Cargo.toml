[package]
license = "Apache-2.0"
name = "grow-diagnostics"
version.workspace = true
edition.workspace = true
description = "Local diagnostics and structured logging for Grow"
authors = ["Grow contributors"]

[features]
default = []
default-bazel = []
memory-log = []

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-chrome = "0.7.2"
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
chrono = { workspace = true }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
grow-config = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }
mid = "4.0.0"
tokio = { workspace = true, features = ["macros", "sync", "rt"] }
parking_lot = { workspace = true }

[dev-dependencies]
filetime = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
