[package]
license = "Apache-2.0"
name = "diagnostics"
version.workspace = true
edition.workspace = true
description = "Local diagnostics and structured logging for Grow"
authors = ["Grow contributors"]

[features]
default = []
default-bazel = []
memory-log = []

[dependencies]
anyhow = { workspace = true }
# Ring provider for `diagnostics::tls::install_ring_provider_once` (same
# feature set as the CLI's own rustls declaration).
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-chrome = "0.7.2"
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
chrono = { workspace = true }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
config = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }
mid = "4.0.0"
tokio = { workspace = true, features = ["macros", "sync", "rt"] }
parking_lot = { workspace = true }
tool-types = { workspace = true }

[dev-dependencies]
# Pre-main unified-log redirect for this crate's own test binary.
ctor = { workspace = true }
filetime = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
