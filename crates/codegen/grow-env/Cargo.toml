[package]
license = "Apache-2.0"
name = "grow-env"
version.workspace = true
edition.workspace = true
description = "Backend environment presets for the Grow CLI crate family: endpoint URL defaults and env-var test support."

[features]
# Exposes `EnvVarGuard` (and its process-wide env lock) to downstream
# crates' test targets.
test-support = []
default-bazel = ["test-support"]

[dependencies]
tracing = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
