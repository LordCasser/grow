[package]
name = "markdown-fuzz"
version = "1.0.0"
publish = false
edition = "2021"

[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.markdown]
path = ".."

# Four full/streaming render calls: pretty/non-pretty, with Syntect disabled.
[[bin]]
name = "render_all"
path = "fuzz_targets/render_all.rs"
test = false
doc = false
bench = false
