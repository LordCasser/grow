[package]
license = "Apache-2.0"
name = "memory"
version.workspace = true
edition.workspace = true

[features]
# Exposes `#[cfg(test)]`-only helpers (`MemoryStorage::with_paths`,
# `MockEmbeddingProvider`) to downstream crates' test targets.
test-support = []

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
dunce = { workspace = true }
git2 = { version = "0.21", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
# rusqlite 0.40 + bundled = self-contained SQLite with FTS5.
# Keep the pre-0.40 default feature set (`cache`) while excluding its new
# WebAssembly-only SQLite FFI default; this index uses bundled native SQLite.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
serde_json = { workspace = true }
# sqlite-vec: vec0 virtual table for KNN vector search.
sqlite-vec = "=0.1.10-alpha.4"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = { workspace = true }
auth = { workspace = true }
config-types = { workspace = true }
grow-http = { workspace = true }
diagnostics = { workspace = true }
tools = { workspace = true }
version = { workspace = true }
sqlite-journal = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
filetime = { workspace = true }
tempfile = { workspace = true }
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path. (`diagnostics` is already a regular dependency.)
ctor = { workspace = true }

[lints]
workspace = true
