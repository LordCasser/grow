[package]
license = "Apache-2.0"
name = "grow-http"
version.workspace = true
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the grow CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
auth = { workspace = true, features = ["middleware"] }
sampler = { path = "../sampler" }
diagnostics = { workspace = true }
version = { workspace = true }
workspace = { workspace = true }

[dev-dependencies]
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path. (`diagnostics` is already a regular dependency.)
ctor = { workspace = true }

[lints]
workspace = true
