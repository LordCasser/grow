[package]
license = "Apache-2.0"
name = "auth"
version.workspace = true
edition.workspace = true
description = "BYOK HTTP credential dependency-inversion seam"
authors = ["Grow contributors"]

[features]
middleware = ["dep:reqwest-middleware", "dep:http"]

[dependencies]
async-trait = { workspace = true }
http = { workspace = true, optional = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
reqwest-middleware = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path.
ctor = { workspace = true }
diagnostics = { workspace = true }

[lints]
workspace = true
