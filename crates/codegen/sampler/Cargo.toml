[package]
license = "Apache-2.0"
name = "sampler"
version.workspace = true
edition.workspace = true
description = "Provider-neutral sampling/inference layer for Grow (HTTP streaming + retry, no shell coupling)"

[dependencies]
# Internal
sampling-types = { path = "../sampling-types" }
version = { workspace = true }

# External
async-openai = { workspace = true }
async-stream = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
eventsource-stream = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Mock HTTP server for actor / request_task integration tests.
axum = { workspace = true }
# Shared SSE generators for the happy-path mock payloads.
test-support = { workspace = true }
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path.
ctor = { workspace = true }
diagnostics = { workspace = true }
# `start_paused = true` for deterministic timeout testing; `net` for
# `TcpListener::bind` in the mock server harness.
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "time",
    "sync",
    "test-util",
    "net",
    "rt-multi-thread",
] }

[lints]
workspace = true
