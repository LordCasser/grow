[package]
license = "Apache-2.0"
name = "grow-telemetry"
version = "0.1.0"
edition.workspace = true
description = "Telemetry engine: product events + Sentry error reporting for Grow sessions"
authors = ["Grow contributors"]

[features]
default = []
default-bazel = []
memory-log = []

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-chrome = "0.7.2"
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
chrono = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
reqwest = { workspace = true }
url = { workspace = true }
grow-env = { workspace = true }
grow-secrets = { workspace = true }
grow-config = { workspace = true }
grow-sampler = { workspace = true }
xai-token-estimation = { workspace = true }
dirs = { workspace = true }
sentry = { version = "0.42.0", default-features = false, features = [
    "panic",
    "anyhow",
    "tracing",
    "backtrace",
    "contexts",
    "reqwest",
    "rustls",
    "debug-images",
] }
whoami = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }
obfstr = { workspace = true, optional = true }
mid = "4.0.0"
tokio = { workspace = true, features = ["macros", "sync", "rt"] }
parking_lot = { workspace = true }
grow-auth = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = [
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "rt-tokio-current-thread",
] }
opentelemetry-otlp = { workspace = true }
opentelemetry-http = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures-executor = "0.3"
tokio-stream = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
tonic = { workspace = true, features = ["transport"] }
# In-memory log/metric exporters for the external-stream wire-shape tests.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# In-process OTLP collector fixture (tests/external_otlp.rs).
axum = { workspace = true }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
# Sets a symlink's own mtime (std's `set_modified` follows links) for prune tests.
filetime = { workspace = true }
futures-executor = "0.3"
tempfile = { workspace = true }

[lints]
workspace = true
