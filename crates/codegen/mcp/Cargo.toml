[package]
license = "Apache-2.0"
name = "mcp"
version.workspace = true
edition.workspace = true
description = "MCP integration crate. Quarantines rmcp + reqwest 0.13 (rmcp 2.1 requires reqwest >= 0.13.2 while the rest of the workspace uses reqwest 0.12) and owns MCP transports and lifecycle."
authors = ["Grow contributors"]

[dependencies]
rmcp = { version = "2.1", features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }
version = { workspace = true }

# reqwest 0.13 feature set for MCP transports. Notably:
# - `blocking` is for build-script style use (not actually used here today, but
#   kept for future MCP transports that may need it).
# - `query`/`form` opt-in features stay off; rmcp transports don't use them.
# - `rustls-no-provider` is REQUIRED: reqwest 0.13.4's `rustls` feature is
#   hardcoded to `__rustls-aws-lc-rs` (verified in its Cargo.toml), and rmcp's
#   `reqwest` feature enables `reqwest?/rustls` the same way. Dropping
#   `rustls-no-provider` would re-introduce aws-lc-rs (cmake/nasm C build) that
#   the workspace removed for OHOS cross-compilation. See
#   docs/architecture/dependency-workarounds.md.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls-no-provider",
    "stream",
] }

async-trait = { workspace = true }
axum = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
config = { workspace = true }

# For mcp_grow_http.rs (rmcp trait signatures). Must match rmcp 2.1's own
# versions or the trait types won't unify.
http = { workspace = true }
sse-stream = "0.2"

# Deps for servers.rs.
agent-client-protocol = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
which = { workspace = true }
# Atomic descriptor writes (NamedTempFile + persist) in materialize_descriptors.
tempfile = { workspace = true }
tools = { workspace = true }
diagnostics = { workspace = true }
workspace-types = { workspace = true }
tool-protocol = { workspace = true }
tool-runtime = { workspace = true }
tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# `test-util` enables `tokio::time::pause` / `advance`, required by
# the deterministic timing tests in `liveness.rs`.
tokio = { workspace = true, features = ["test-util"] }
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path.
ctor = { workspace = true }

[lints]
workspace = true
