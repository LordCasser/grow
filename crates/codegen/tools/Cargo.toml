[package]
license = "Apache-2.0"
edition.workspace = true
name = "tools"
version.workspace = true
description = "Grow tools library"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
dirs = { workspace = true }
derive_more = { workspace = true, features = ["from", "try_into"] }
dunce = { workspace = true }
fs2 = { workspace = true }
educe = { workspace = true, features = ["Debug"] }
tty-utils = { workspace = true }
config = { path = "../config" }
version = { workspace = true }
token-estimation = { workspace = true }
async-lsp = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
anydoc = "0.1.7"
base64 = { workspace = true }
crc32fast = { workspace = true }
ignore = { workspace = true }
infer = { workspace = true }
globset = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
pdf = { workspace = true }
pdf-inspector = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
minijinja = { version = "2", features = ["custom_syntax"] }
parking_lot = { workspace = true }
htmd = { workspace = true }
scraper = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "json", "gzip", "brotli", "deflate"] }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
tool-runtime = { workspace = true }
tool-types = { workspace = true }
tool-protocol = { workspace = true }

futures = { workspace = true }
similar = { workspace = true }
strum = { workspace = true }
strip-ansi-escapes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
wildmatch = { workspace = true }
serde_yaml = { workspace = true }
shellexpand = "3.1"
tempfile = { workspace = true }
which = { workspace = true }

chrono = { workspace = true }
futures-util = { workspace = true }
sandbox = { path = "../sandbox", default-features = false }
dhat = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
command-fds = { version = "0.3", features = ["tokio"] }
nix = { workspace = true, features = ["signal", "process", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

# windows: util::spawn uses Win32 Job Objects (CreateJobObjectW,
# AssignProcessToJobObject, TerminateJobObject) and process creation flags
# (CREATE_NO_WINDOW, DETACHED_PROCESS, CREATE_NEW_PROCESS_GROUP).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
dirs = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
test-support = { workspace = true }
test-utils = { workspace = true }
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path.
ctor = { workspace = true }
diagnostics = { workspace = true }

[build-dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }

[lints]
workspace = true

[features]
default-bazel = ["serde"]
default = ["serde"]
serde = []
dhat-heap = ["dep:dhat"]
