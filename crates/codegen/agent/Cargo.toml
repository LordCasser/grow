[package]
license = "Apache-2.0"
name = "agent"
version.workspace = true
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
hooks = { path = "../hooks" }
tools = { path = "../tools" }
tty-utils = { workspace = true }
token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
dirs = { workspace = true }
config = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tool-types.workspace = true

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
# `ctor` installs the rustls ring provider once before tests run (via
# `diagnostics::tls::install_ring_provider_once`): reqwest is built with
# `rustls-no-provider` (see docs/architecture/dependency-workarounds.md), and
# the provider is only installed by CLI startup in production — tests bypass
# that startup path.
ctor = { workspace = true }
diagnostics = { workspace = true }

[lints]
workspace = true
