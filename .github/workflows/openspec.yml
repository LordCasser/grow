name: OpenSpec

on:
  workflow_call:
    inputs:
      commit:
        description: Immutable commit to validate
        required: true
        type: string
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-${{ github.workflow }}-${{ inputs.commit || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Verify immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected a full immutable commit SHA, found: $EXPECTED_COMMIT" >&2
            exit 1
          }
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_COMMIT" ]] || {
            echo "checked out $actual but expected $EXPECTED_COMMIT" >&2
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.11.0
      - name: Validate active changes and current specifications
        run: openspec validate --all --strict --no-interactive
      - name: Validate archived task completion
        run: openspec validate --archived --no-interactive
