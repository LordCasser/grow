# Official Grow release assets for the three supported platforms:
#   macos-aarch64, linux-x86_64, linux-aarch64
# Asset names must stay grow-{version}-{asset_platform} for grow-update.
#
# Linux builds run inside an AlmaLinux 8 container (glibc 2.28 baseline) so the
# shipped binaries work on older distros than the ubuntu-24.04 runner provides.
# The container only links: the toolchain (rustc) comes from the host rustup
# install, mounted into the container (official rustc builds run on glibc >= 2.17).
name: Build release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DIST_INCREMENTAL: "false"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Real GHA: fetch the release tag from the remote.
      # Local act: bind-mount the clone and skip actions/checkout — that action
      # cleans the workdir and re-fetches origin, which wipes uncommitted work
      # and fails when the tag exists only locally.
      - uses: actions/checkout@v6
        if: ${{ !env.ACT }}
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Act — use bind-mounted workspace
        if: ${{ env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null
          echo "ACT workspace HEAD=$(git rev-parse --short HEAD) tag=${RELEASE_TAG}→$(git rev-parse --short "${RELEASE_TAG}^{commit}")"

      # cargo metadata needs a toolchain (not preinstalled on GHA / act images).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - id: version
        name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            # Read workspace version from the tagged tree without checkout wipe.
            version="$(git show "${RELEASE_TAG}:Cargo.toml" \
              | awk '
                  $0 == "[workspace.package]" { in_pkg=1; next }
                  in_pkg && /^\[/ { exit }
                  in_pkg && $1 == "version" {
                    gsub(/"/, "", $3); print $3; exit
                  }
                ')"
          else
            version="$(cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "grow-pager-bin") | .version')"
          fi
          tag_version="${RELEASE_TAG#v}"
          test -n "$version"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match grow-pager-bin / workspace $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset_platform }}
    needs: validate
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64: glibc 2.28 baseline via the AlmaLinux 8 build container.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_platform: linux-x86_64
            binary: grow
            linux: true
            rg_target: x86_64-unknown-linux-musl
            rg_sha256: 253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7
          # Linux arm64: same glibc 2.28 container. Official ripgrep has no
          # aarch64-musl asset for 15.0.0, so embed the gnu build (extracted
          # sidecar; runnable on any distro with glibc >= the rg build baseline).
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_platform: linux-aarch64
            binary: grow
            linux: true
            rg_target: aarch64-unknown-linux-gnu
            rg_sha256: 15f8cc2fab12d88491c54d49f38589922a9d6a7353c29b0a0856727bcdf80754
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_platform: macos-aarch64
            binary: grow
            linux: false
            rg_target: aarch64-apple-darwin
            rg_sha256: 98bb2e61e7277ba0ea72d2ae2592497fd8d2940934a16b122448d302a6637e3b
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ !env.ACT }}
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Act — checkout tagged tree on bind mount
        if: ${{ env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "act build requires a clean worktree (bind mount shares the host clone)" >&2
            git status --short >&2
            exit 1
          fi
          # Remember how to restore after the job (always step below).
          if branch="$(git symbolic-ref -q --short HEAD 2>/dev/null)"; then
            echo "ACT_RESTORE_REF=${branch}" >> "$GITHUB_ENV"
          else
            echo "ACT_RESTORE_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          git checkout --detach "${RELEASE_TAG}"
          echo "ACT build tree=$(git rev-parse --short HEAD) (${RELEASE_TAG})"

      # Toolchain on the host: rustc/rustup (official builds, glibc >= 2.17) run
      # fine inside the AlmaLinux 8 container; the container provides the linker
      # (gcc 8.5) so the binary's glibc baseline is the container's 2.28.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      # macOS builds compile directly on the runner and use this PATH protoc.
      - uses: arduino/setup-protoc@v3
        if: ${{ !matrix.linux }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          shared-key: release-dist

      # The Linux build runs inside a container: only the workspace (and the
      # host CARGO_HOME/RUSTUP_HOME mounts in the Build step) is visible, so
      # protoc and the ripgrep sidecar must live under $GITHUB_WORKSPACE.
      - name: Prepare protoc (Linux container build)
        if: matrix.linux
        shell: bash
        env:
          PROTOC_VERSION: "30.1"
          PROTOC_ARCH: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'x86_64' || 'aarch_64' }}
          PROTOC_SHA256: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '5537e15ab0c0e610f809573948d3ec7d6ef387a07991e1c361a2a0e8cad983e5' || 'e866d3dc4775e8032721915e83e3fb6e1ab4def7199a49b4f95c4d1f6cf4c03a' }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.build-tools/protoc"
          archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}-linux-${PROTOC_ARCH}.zip"
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${PROTOC_ARCH}.zip"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output "$archive" "$url"
          echo "${PROTOC_SHA256}  $archive" | sha256sum -c -
          unzip -q -o "$archive" -d "${GITHUB_WORKSPACE}/.build-tools/protoc"
          test -x "${GITHUB_WORKSPACE}/.build-tools/protoc/bin/protoc"
          "${GITHUB_WORKSPACE}/.build-tools/protoc/bin/protoc" --version
          echo "PROTOC=${GITHUB_WORKSPACE}/.build-tools/protoc/bin/protoc" >> "$GITHUB_ENV"

      - name: Prepare bundled ripgrep
        shell: bash
        env:
          RG_VERSION: "15.0.0"
          RG_TARGET: ${{ matrix.rg_target }}
          RG_SHA256: ${{ matrix.rg_sha256 }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ripgrep-${RG_VERSION}-${RG_TARGET}.tar.gz"
          # Under $GITHUB_WORKSPACE so the Linux build container sees it.
          bundle_dir="${GITHUB_WORKSPACE}/.build-tools/rg/ripgrep-${RG_VERSION}-${RG_TARGET}"
          url="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-${RG_TARGET}.tar.gz"

          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output "$archive" "$url"
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual_sha256" = "$RG_SHA256"

          mkdir -p "$bundle_dir"
          tar -xzf "$archive" --strip-components=1 -C "$bundle_dir"
          test -x "$bundle_dir/rg"
          # Validate runnability on the native runner (the gnu rg sidecar needs
          # newer glibc than the AlmaLinux 8 build container provides; that is
          # fine for real deployment targets, see grow-tools build.rs).
          "$bundle_dir/rg" --version >/dev/null
          echo "GROW_TOOLS_BUNDLE_RG_PATH=$bundle_dir/rg" >> "$GITHUB_ENV"

      - name: Build Grow (AlmaLinux 8 container, glibc 2.28 baseline)
        if: matrix.linux
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          GROW_VERSION: ${{ needs.validate.outputs.version }}
          GROW_TOOLS_BUNDLE_RG_SKIP_EXEC_CHECK: "1"
        run: |
          set -euo pipefail
          # rustup/cargo default to $HOME/.cargo and $HOME/.rustup when the
          # env vars are unset (dtolnay/rust-toolchain does not export them).
          CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${CARGO_HOME}:${CARGO_HOME}" -v "${RUSTUP_HOME}:${RUSTUP_HOME}" \
            -e "PATH=${CARGO_HOME}/bin:${PATH}" \
            -e "CARGO_HOME=${CARGO_HOME}" -e "RUSTUP_HOME=${RUSTUP_HOME}" \
            -e "GROW_VERSION=${GROW_VERSION}" \
            -e "PROTOC=${PROTOC}" \
            -e "GROW_TOOLS_BUNDLE_RG_PATH=${GROW_TOOLS_BUNDLE_RG_PATH}" \
            -e "GROW_TOOLS_BUNDLE_RG_SKIP_EXEC_CHECK=1" \
            -e "TARGET_TRIPLE=${TARGET_TRIPLE}" \
            -e "CARGO_INCREMENTAL=0" \
            almalinux:8 bash -euo pipefail -c '
              dnf install -y gcc gcc-c++ make cmake git perl pkgconf >/dev/null
              cargo build --locked --profile release-dist \
                -p grow-pager-bin --bin grow --target "${TARGET_TRIPLE}"
            '

      - name: Build Grow (macOS)
        if: ${{ !matrix.linux }}
        shell: bash
        env:
          GROW_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cargo build --locked --profile release-dist \
            -p grow-pager-bin --bin grow --target "${{ matrix.target }}"

      - name: Smoke-test binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release-dist/${{ matrix.binary }}"
          test -x "$BIN"
          test -s "$BIN"
          # Native same-arch runners: the glibc binary runs on the ubuntu/macos host.
          version_out="$("$BIN" --version)"
          echo "$version_out"
          echo "$version_out" | grep -F "${{ needs.validate.outputs.version }}"

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release-dist/${{ matrix.binary }}" \
            "dist/grow-${{ needs.validate.outputs.version }}-${{ matrix.asset_platform }}"

      - uses: actions/upload-artifact@v7
        with:
          name: grow-${{ matrix.asset_platform }}
          path: dist/grow-*
          if-no-files-found: error
          retention-days: 3

      - name: Act — restore bind-mounted branch
        if: ${{ always() && env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACT_RESTORE_REF:-}" ]]; then
            git checkout -f "${ACT_RESTORE_REF}"
            echo "restored ${ACT_RESTORE_REF}"
          fi

  # Intermediate build outputs stay on the Actions run (upload-artifact).
  # The GitHub Release page only gets final grow binaries for end users.
  publish:
    name: Publish release assets
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: grow-*
          path: dist
          merge-multiple: true

      - name: Verify staged binaries
        working-directory: dist
        run: |
          set -euo pipefail
          # Official CI: exactly three platform assets.
          # Local act often runs a matrix subset (Linux only) — require ≥1.
          mapfile -t assets < <(find . -maxdepth 1 -type f -name 'grow-*' | sort)
          if [[ "${ACT:-}" == "true" ]]; then
            test "${#assets[@]}" -ge 1
          else
            test "${#assets[@]}" -eq 3
          fi
          for f in "${assets[@]}"; do
            test -s "$f"
            echo "release asset: ${f#./} ($(wc -c <"$f") bytes)"
          done
          sha256sum grow-*

      # Never touch a real GitHub Release from local act runs.
      - name: Upload grow binaries to GitHub Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only grow-{version}-{platform} binaries — no checksum files, no archives.
          gh release upload "$RELEASE_TAG" dist/grow-* --clobber

      - name: Act dry-run summary
        if: ${{ env.ACT }}
        working-directory: dist
        run: |
          set -euo pipefail
          echo "ACT=true: skipping gh release upload. Staged assets:"
          ls -la grow-*
