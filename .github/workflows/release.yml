# Official Grow release entry workflow.
#
# Splits the release pipeline into:
#   release.yml    — entry: validate tag, select platform matrix, publish
#   build-one.yml  — reusable workflow: build + package ONE asset platform
#
# Triggered explicitly from the default branch with an existing release tag.
# The build still checks out the exact tag, while GitHub Actions caches remain
# in the default-branch scope and can be reused by later releases. `publish`
# is only allowed when every group is selected (the updater contract requires
# the full asset set on the GitHub Release).
#
# Updater-visible assets use grow-{version}-{asset_platform}.tar.gz and
# contain exactly one executable: `grow` on Unix, `grow.exe` on Windows.
name: Build release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.1.0)
        required: true
        type: string
      build_linux:
        description: Build linux-* assets (x86_64, aarch64, riscv64, x86_64-musl, aarch64-musl)
        type: boolean
        default: true
      build_macos:
        description: Build macos-* assets (aarch64, x86_64)
        type: boolean
        default: true
      build_windows:
        description: Build windows-* assets (x86_64, aarch64)
        type: boolean
        default: true
      build_ohos:
        description: Build ohos-aarch64 asset
        type: boolean
        default: true
      publish:
        description: Publish to the GitHub Release (requires all platform groups)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REPO: LordCasser/grow
  RELEASE_TAG: ${{ inputs.tag }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ !env.ACT }}
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Match updater release repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" != "true" && "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "official releases must be dispatched from the default branch (${DEFAULT_BRANCH}); current ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null || {
            echo "release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          if [[ "${ACT:-}" == "true" ]]; then
            updater_repo="$(
              git show "${RELEASE_TAG}:crates/codegen/update/src/version.rs" \
                | sed -n 's/^pub const GH_RELEASE_REPO: &str = "\([^"]*\)";/\1/p'
            )"
          else
            updater_repo="$(
              sed -n 's/^pub const GH_RELEASE_REPO: &str = "\([^"]*\)";/\1/p' \
                crates/codegen/update/src/version.rs
            )"
          fi
          test -n "$updater_repo"
          if [[ "$updater_repo" != "$RELEASE_REPO" ]]; then
            echo "release workflow repo $RELEASE_REPO does not match updater repo $updater_repo" >&2
            exit 1
          fi
          if [[ "${ACT:-}" != "true" && "$GITHUB_REPOSITORY" != "$RELEASE_REPO" ]]; then
            echo "official release workflow only runs in $RELEASE_REPO (current: $GITHUB_REPOSITORY)" >&2
            exit 1
          fi

      - name: Act — verify bind-mounted workspace
        if: ${{ env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null
          echo "ACT workspace HEAD=$(git rev-parse --short HEAD) tag=${RELEASE_TAG}→$(git rev-parse --short "${RELEASE_TAG}^{commit}")"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - id: version
        name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            version="$(git show "${RELEASE_TAG}:Cargo.toml" \
              | awk '
                  $0 == "[workspace.package]" { in_pkg=1; next }
                  in_pkg && /^\[/ { exit }
                  in_pkg && $1 == "version" {
                    gsub(/"/, "", $3); print $3; exit
                  }
                ')"
          else
            version="$(cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "cli") | .version')"
          fi
          tag_version="${RELEASE_TAG#v}"
          test -n "$version"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match cli / workspace $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Platform catalog: single source of truth for every release asset.
  # Boolean inputs filter by group. The resulting JSON array drives the build
  # job's matrix (matrix.include = fromJson(...)), so an empty selection
  # expands to zero build combinations.
  select:
    name: Select platform matrix
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.filter.outputs.platforms }}
    env:
      BUILD_LINUX: ${{ inputs.build_linux }}
      BUILD_MACOS: ${{ inputs.build_macos }}
      BUILD_WINDOWS: ${{ inputs.build_windows }}
      BUILD_OHOS: ${{ inputs.build_ohos }}
    steps:
      - id: filter
        name: Filter platforms by selected groups
        shell: bash
        run: |
          set -euo pipefail
          # OpenHarmony (aarch64-unknown-linux-ohos): built natively inside
          # the Harmonybrew ci-runner container (OHOS userland) on an arm64
          # runner. OHOS releases do NOT bundle ripgrep (no GitHub prebuilt
          # exists for this target); the binary resolves `rg` from PATH at
          # runtime and search tools error with an install hint when it is
          # missing. Smoke runs inside the container (the binary cannot run
          # on the ubuntu runner), so `smoke: false` keeps the shared
          # runner smoke off.
          cat <<'JSONEOF' > "${RUNNER_TEMP}/release-platforms.json"
          [
            {
              "group": "linux",
              "asset_platform": "linux-x86_64",
              "target": "x86_64-unknown-linux-gnu",
              "runner": "ubuntu-24.04",
              "builder": "alma",
              "smoke": true,
              "rg_repository": "BurntSushi/ripgrep",
              "rg_tag": "15.0.0",
              "rg_archive": "ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz",
              "rg_sha256": "253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7",
              "rg_strip_components": 1,
              "rg_runnable": true
            },
            {
              "group": "linux",
              "asset_platform": "linux-aarch64",
              "target": "aarch64-unknown-linux-gnu",
              "runner": "ubuntu-24.04-arm",
              "builder": "alma",
              "smoke": true,
              "rg_repository": "microsoft/ripgrep-prebuilt",
              "rg_tag": "v15.0.0",
              "rg_archive": "ripgrep-v15.0.0-aarch64-unknown-linux-musl.tar.gz",
              "rg_sha256": "47c6ea56f4d18bc26778eaca9b9c3f6e201b7c7d78d5ebc528dfda47e0e8f1ba",
              "rg_strip_components": 0,
              "rg_runnable": true
            },
            {
              "group": "linux",
              "asset_platform": "linux-riscv64",
              "target": "riscv64gc-unknown-linux-gnu",
              "runner": "ubuntu-24.04",
              "builder": "cross",
              "smoke": false,
              "rg_repository": "microsoft/ripgrep-prebuilt",
              "rg_tag": "v15.0.0",
              "rg_archive": "ripgrep-v15.0.0-riscv64gc-unknown-linux-gnu.tar.gz",
              "rg_sha256": "49d7a681e4d22ffc523185682719332763ae182256e7360b9f621dc3268e7d08",
              "rg_strip_components": 0,
              "rg_runnable": false
            },
            {
              "group": "linux",
              "asset_platform": "linux-x86_64-musl",
              "target": "x86_64-unknown-linux-musl",
              "runner": "ubuntu-24.04",
              "builder": "cross",
              "smoke": false,
              "rg_repository": "BurntSushi/ripgrep",
              "rg_tag": "15.0.0",
              "rg_archive": "ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz",
              "rg_sha256": "253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7",
              "rg_strip_components": 1,
              "rg_runnable": true
            },
            {
              "group": "linux",
              "asset_platform": "linux-aarch64-musl",
              "target": "aarch64-unknown-linux-musl",
              "runner": "ubuntu-24.04",
              "builder": "cross",
              "smoke": false,
              "rg_repository": "microsoft/ripgrep-prebuilt",
              "rg_tag": "v15.0.0",
              "rg_archive": "ripgrep-v15.0.0-aarch64-unknown-linux-musl.tar.gz",
              "rg_sha256": "47c6ea56f4d18bc26778eaca9b9c3f6e201b7c7d78d5ebc528dfda47e0e8f1ba",
              "rg_strip_components": 0,
              "rg_runnable": false
            },
            {
              "group": "macos",
              "asset_platform": "macos-aarch64",
              "target": "aarch64-apple-darwin",
              "runner": "macos-15",
              "builder": "macos",
              "smoke": true,
              "rg_repository": "BurntSushi/ripgrep",
              "rg_tag": "15.0.0",
              "rg_archive": "ripgrep-15.0.0-aarch64-apple-darwin.tar.gz",
              "rg_sha256": "98bb2e61e7277ba0ea72d2ae2592497fd8d2940934a16b122448d302a6637e3b",
              "rg_strip_components": 1,
              "rg_runnable": true
            },
            {
              "group": "macos",
              "asset_platform": "macos-x86_64",
              "target": "x86_64-apple-darwin",
              "runner": "macos-15-intel",
              "builder": "macos",
              "smoke": true,
              "rg_repository": "BurntSushi/ripgrep",
              "rg_tag": "15.0.0",
              "rg_archive": "ripgrep-15.0.0-x86_64-apple-darwin.tar.gz",
              "rg_sha256": "44128c733d127ddbda461e01225a68b5f9997cfe7635242a797f645ca674a71a",
              "rg_strip_components": 1,
              "rg_runnable": true
            },
            {
              "group": "windows",
              "asset_platform": "windows-x86_64",
              "target": "x86_64-pc-windows-msvc",
              "runner": "windows-2025",
              "builder": "windows",
              "smoke": true,
              "rg_repository": "BurntSushi/ripgrep",
              "rg_tag": "15.0.0",
              "rg_archive": "ripgrep-15.0.0-x86_64-pc-windows-msvc.zip",
              "rg_sha256": "21a98bf42c4da97ca543c010e764cc6dec8b9b7538d05f8d21874016385e0860",
              "rg_strip_components": 1,
              "rg_runnable": true
            },
            {
              "group": "windows",
              "asset_platform": "windows-aarch64",
              "target": "aarch64-pc-windows-msvc",
              "runner": "windows-11-arm",
              "builder": "windows",
              "smoke": true,
              "rg_repository": "BurntSushi/ripgrep",
              "rg_tag": "15.0.0",
              "rg_archive": "ripgrep-15.0.0-aarch64-pc-windows-msvc.zip",
              "rg_sha256": "572709c8770cb7f9385d725cb06d2bcd9537ec24d4dd17b1be1d65a876f8b591",
              "rg_strip_components": 1,
              "rg_runnable": true
            },
            {
              "group": "ohos",
              "asset_platform": "ohos-aarch64",
              "target": "aarch64-unknown-linux-ohos",
              "runner": "ubuntu-24.04-arm",
              "builder": "ohos",
              "smoke": false,
              "rg_repository": "BurntSushi/ripgrep",
              "rg_tag": "15.0.0",
              "rg_archive": "(not bundled; no GitHub asset for this target)",
              "rg_sha256": "(not bundled; no GitHub asset for this target)",
              "rg_strip_components": 0,
              "rg_runnable": false
            }
          ]
          JSONEOF

          jq -c \
            --argjson linux "${BUILD_LINUX}" \
            --argjson macos "${BUILD_MACOS}" \
            --argjson windows "${BUILD_WINDOWS}" \
            --argjson ohos "${BUILD_OHOS}" \
            '[.[] | select((.group == "linux" and $linux) or (.group == "macos" and $macos) or (.group == "windows" and $windows) or (.group == "ohos" and $ohos))]' \
            "${RUNNER_TEMP}/release-platforms.json" > "${RUNNER_TEMP}/selected.json"
          selected="$(jq -c . "${RUNNER_TEMP}/selected.json")"
          echo "selected $(jq 'length' <<<"$selected") platform(s)"
          echo "platforms=${selected}" >> "$GITHUB_OUTPUT"

  # Manual dispatch sanity checks. Must stay a plain (never skipped) job so
  # publish can depend on it even for partial, non-publishing builds.
  dispatch-guard:
    name: Validate dispatch inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Require at least one platform group; publish requires all four
        shell: bash
        run: |
          set -euo pipefail
          linux="${{ inputs.build_linux }}"
          macos="${{ inputs.build_macos }}"
          windows="${{ inputs.build_windows }}"
          ohos="${{ inputs.build_ohos }}"
          publish="${{ inputs.publish }}"
          selected=0
          for v in "$linux" "$macos" "$windows" "$ohos"; do
            [[ "$v" == "true" ]] && selected=$((selected + 1))
          done
          if [[ "$selected" -eq 0 ]]; then
            echo "::error::No platform group selected: check at least one of build_linux / build_macos / build_windows / build_ohos." >&2
            exit 1
          fi
          if [[ "$publish" == "true" && "$selected" -lt 4 ]]; then
            echo "::error::publish=true requires all 4 platform groups (selected ${selected}/4). Uncheck publish for partial builds." >&2
            exit 1
          fi

  # One call of build-one.yml per selected platform. The matrix comes from
  # the select job output; an empty selection expands to zero combinations
  # and this job is skipped.
  build:
    name: Build ${{ matrix.asset_platform }}
    needs:
      - validate
      - select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select.outputs.platforms) }}
    uses: ./.github/workflows/build-one.yml
    with:
      runner: ${{ matrix.runner }}
      asset_platform: ${{ matrix.asset_platform }}
      target: ${{ matrix.target }}
      builder: ${{ matrix.builder }}
      smoke: ${{ matrix.smoke }}
      rg_repository: ${{ matrix.rg_repository }}
      rg_tag: ${{ matrix.rg_tag }}
      rg_archive: ${{ matrix.rg_archive }}
      rg_sha256: ${{ matrix.rg_sha256 }}
      rg_strip_components: ${{ matrix.rg_strip_components }}
      rg_runnable: ${{ matrix.rg_runnable }}
      release_tag: ${{ inputs.tag }}
      grow_version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish release assets
    needs:
      - validate
      - build
      - dispatch-guard
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: grow-*
          path: dist
          merge-multiple: true

      - name: Verify staged binaries
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          required=(
            "grow-${version}-linux-x86_64.tar.gz"
            "grow-${version}-linux-aarch64.tar.gz"
            "grow-${version}-linux-riscv64.tar.gz"
            "grow-${version}-linux-x86_64-musl.tar.gz"
            "grow-${version}-linux-aarch64-musl.tar.gz"
            "grow-${version}-macos-aarch64.tar.gz"
            "grow-${version}-macos-x86_64.tar.gz"
            "grow-${version}-windows-x86_64.tar.gz"
            "grow-${version}-windows-aarch64.tar.gz"
            "grow-${version}-ohos-aarch64.tar.gz"
          )
          mapfile -t assets < <(find . -maxdepth 1 -type f -name 'grow-*' -printf '%f\n' | sort)

          if [[ "${ACT:-}" != "true" ]]; then
            test "${#assets[@]}" -eq "${#required[@]}"
            for name in "${required[@]}"; do
              test -s "$name"
            done
          else
            test "${#assets[@]}" -ge 1
          fi

          for name in "${assets[@]}"; do
            known=false
            for required_name in "${required[@]}"; do
              if [[ "$name" == "$required_name" ]]; then
                known=true
                break
              fi
            done
            [[ "$known" == "true" ]] || {
              echo "asset name is outside the updater contract: $name" >&2
              exit 1
            }
            expected_entry=grow
            if [[ "$name" == *-windows-*.tar.gz ]]; then
              expected_entry=grow.exe
            fi
            if [[ "$(tar -tzf "$name")" != "$expected_entry" ]]; then
              echo "$name must contain exactly one $expected_entry executable" >&2
              exit 1
            fi
            echo "release asset: $name ($(wc -c <"$name") bytes)"
          done

          ohos_asset="grow-${version}-ohos-aarch64.tar.gz"
          if [[ -f "$ohos_asset" ]]; then
            ohos_asset_size="$(wc -c <"$ohos_asset")"
            if (( ohos_asset_size >= 80000000 )); then
              echo "$ohos_asset is unexpectedly large: ${ohos_asset_size} bytes" >&2
              exit 1
            fi
            ohos_verify_dir="$(mktemp -d "${RUNNER_TEMP}/grow-ohos-verify.XXXXXX")"
            tar -xzf "$ohos_asset" -C "$ohos_verify_dir"
            file "$ohos_verify_dir/grow" | grep -F 'stripped'
            readelf -SW "$ohos_verify_dir/grow" | awk '
              $2 == ".codesign" {
                found = 1
                if ($3 != "PROGBITS" || $6 != "001000" || $NF != "4096") exit 2
              }
              END { if (!found) exit 1 }
            '
          fi
          sha256sum grow-*

      - name: Prepare hidden GitHub Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          expected_prerelease=false
          if [[ "$version" == *-* ]]; then
            expected_prerelease=true
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft
            fi
          else
            release_args=(--verify-tag --draft --title "$RELEASE_TAG" --generate-notes)
            if [[ "$expected_prerelease" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          fi

          actual_prerelease="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')"
          if [[ "$actual_prerelease" != "$expected_prerelease" ]]; then
            gh release edit "$RELEASE_TAG" --prerelease="$expected_prerelease"
          fi

      - name: Upload Grow binaries
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/grow-* --clobber

      - name: Verify and publish GitHub Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          required=(
            "grow-${version}-linux-x86_64.tar.gz"
            "grow-${version}-linux-aarch64.tar.gz"
            "grow-${version}-linux-riscv64.tar.gz"
            "grow-${version}-linux-x86_64-musl.tar.gz"
            "grow-${version}-linux-aarch64-musl.tar.gz"
            "grow-${version}-macos-aarch64.tar.gz"
            "grow-${version}-macos-x86_64.tar.gz"
            "grow-${version}-windows-x86_64.tar.gz"
            "grow-${version}-windows-aarch64.tar.gz"
            "grow-${version}-ohos-aarch64.tar.gz"
          )
          remote_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          remote_asset_count="$(sed '/^$/d' <<<"$remote_assets" | wc -l | tr -d ' ')"
          if [[ "$remote_asset_count" -ne "${#required[@]}" ]]; then
            echo "Release must contain exactly ${#required[@]} updater assets; found $remote_asset_count" >&2
            printf '%s\n' "$remote_assets" >&2
            exit 1
          fi
          for name in "${required[@]}"; do
            grep -Fqx "$name" <<<"$remote_assets" || {
              echo "Release is missing updater asset: $name" >&2
              exit 1
            }
          done
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

      - name: Act dry-run summary
        if: ${{ env.ACT }}
        working-directory: dist
        shell: bash
        run: ls -la grow-*
