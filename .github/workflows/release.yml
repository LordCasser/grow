# Official Grow release targets. Updater-visible assets use
# grow-{version}-{asset_platform}.tar.gz and contain exactly one executable:
# `grow` on Unix, `grow.exe` on Windows.
name: Build release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DIST_INCREMENTAL: "false"
  RELEASE_REPO: LordCasser/grow
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ !env.ACT }}
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Match updater release repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            updater_repo="$(
              git show "${RELEASE_TAG}:crates/codegen/update/src/version.rs" \
                | sed -n 's/^pub const GH_RELEASE_REPO: &str = "\([^"]*\)";/\1/p'
            )"
          else
            updater_repo="$(
              sed -n 's/^pub const GH_RELEASE_REPO: &str = "\([^"]*\)";/\1/p' \
                crates/codegen/update/src/version.rs
            )"
          fi
          test -n "$updater_repo"
          if [[ "$updater_repo" != "$RELEASE_REPO" ]]; then
            echo "release workflow repo $RELEASE_REPO does not match updater repo $updater_repo" >&2
            exit 1
          fi
          if [[ "${ACT:-}" != "true" && "$GITHUB_REPOSITORY" != "$RELEASE_REPO" ]]; then
            echo "official release workflow only runs in $RELEASE_REPO (current: $GITHUB_REPOSITORY)" >&2
            exit 1
          fi

      - name: Act — verify bind-mounted workspace
        if: ${{ env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null
          echo "ACT workspace HEAD=$(git rev-parse --short HEAD) tag=${RELEASE_TAG}→$(git rev-parse --short "${RELEASE_TAG}^{commit}")"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - id: version
        name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            version="$(git show "${RELEASE_TAG}:Cargo.toml" \
              | awk '
                  $0 == "[workspace.package]" { in_pkg=1; next }
                  in_pkg && /^\[/ { exit }
                  in_pkg && $1 == "version" {
                    gsub(/"/, "", $3); print $3; exit
                  }
                ')"
          else
            version="$(cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "cli") | .version')"
          fi
          tag_version="${RELEASE_TAG#v}"
          test -n "$version"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match cli / workspace $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset_platform }}
    needs: validate
    timeout-minutes: 180
    runs-on: ${{ matrix.runner }}
    env:
      ASSET_PLATFORM: ${{ matrix.asset_platform }}
      TARGET_TRIPLE: ${{ matrix.target }}
      GROW_VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            builder: alma
            smoke: true
            rg_repository: BurntSushi/ripgrep
            rg_tag: 15.0.0
            rg_archive: ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz
            rg_sha256: 253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7
            rg_strip_components: 1
            rg_runnable: true
          - asset_platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            builder: alma
            smoke: true
            rg_repository: microsoft/ripgrep-prebuilt
            rg_tag: v15.0.0
            rg_archive: ripgrep-v15.0.0-aarch64-unknown-linux-musl.tar.gz
            rg_sha256: 47c6ea56f4d18bc26778eaca9b9c3f6e201b7c7d78d5ebc528dfda47e0e8f1ba
            rg_strip_components: 0
            rg_runnable: true
          - asset_platform: linux-riscv64
            target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-24.04
            builder: cross
            smoke: false
            rg_repository: microsoft/ripgrep-prebuilt
            rg_tag: v15.0.0
            rg_archive: ripgrep-v15.0.0-riscv64gc-unknown-linux-gnu.tar.gz
            rg_sha256: 49d7a681e4d22ffc523185682719332763ae182256e7360b9f621dc3268e7d08
            rg_strip_components: 0
            rg_runnable: false
          - asset_platform: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: cross
            smoke: false
            rg_repository: BurntSushi/ripgrep
            rg_tag: 15.0.0
            rg_archive: ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz
            rg_sha256: 253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7
            rg_strip_components: 1
            rg_runnable: true
          - asset_platform: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: cross
            smoke: false
            rg_repository: microsoft/ripgrep-prebuilt
            rg_tag: v15.0.0
            rg_archive: ripgrep-v15.0.0-aarch64-unknown-linux-musl.tar.gz
            rg_sha256: 47c6ea56f4d18bc26778eaca9b9c3f6e201b7c7d78d5ebc528dfda47e0e8f1ba
            rg_strip_components: 0
            rg_runnable: false
          - asset_platform: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            builder: macos
            smoke: true
            rg_repository: BurntSushi/ripgrep
            rg_tag: 15.0.0
            rg_archive: ripgrep-15.0.0-aarch64-apple-darwin.tar.gz
            rg_sha256: 98bb2e61e7277ba0ea72d2ae2592497fd8d2940934a16b122448d302a6637e3b
            rg_strip_components: 1
            rg_runnable: true
          - asset_platform: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            builder: macos
            smoke: true
            rg_repository: BurntSushi/ripgrep
            rg_tag: 15.0.0
            rg_archive: ripgrep-15.0.0-x86_64-apple-darwin.tar.gz
            rg_sha256: 44128c733d127ddbda461e01225a68b5f9997cfe7635242a797f645ca674a71a
            rg_strip_components: 1
            rg_runnable: true
          - asset_platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
            builder: windows
            smoke: true
            rg_repository: BurntSushi/ripgrep
            rg_tag: 15.0.0
            rg_archive: ripgrep-15.0.0-x86_64-pc-windows-msvc.zip
            rg_sha256: 21a98bf42c4da97ca543c010e764cc6dec8b9b7538d05f8d21874016385e0860
            rg_strip_components: 1
            rg_runnable: true
          - asset_platform: windows-aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            builder: windows
            smoke: true
            rg_repository: BurntSushi/ripgrep
            rg_tag: 15.0.0
            rg_archive: ripgrep-15.0.0-aarch64-pc-windows-msvc.zip
            rg_sha256: 572709c8770cb7f9385d725cb06d2bcd9537ec24d4dd17b1be1d65a876f8b591
            rg_strip_components: 1
            rg_runnable: true
          # OpenHarmony (aarch64-unknown-linux-ohos): built natively inside the
          # Harmonybrew ci-runner container (OHOS userland) on an arm64 runner.
          # OHOS releases do NOT bundle ripgrep (no GitHub prebuilt exists for
          # this target); the binary resolves `rg` from PATH at runtime and
          # search tools error with an install hint when it is missing. The
          # shared "Prepare bundled ripgrep" download step is skipped for this
          # builder. Smoke runs inside the container (the binary cannot run on
          # the ubuntu runner), so `smoke: false` keeps the shared runner
          # smoke off.
          - asset_platform: ohos-aarch64
            target: aarch64-unknown-linux-ohos
            runner: ubuntu-24.04-arm
            builder: ohos
            smoke: false
            rg_repository: BurntSushi/ripgrep
            rg_tag: 15.0.0
            rg_archive: (not bundled; no GitHub asset for this target)
            rg_sha256: (not bundled; no GitHub asset for this target)
            rg_strip_components: 0
            rg_runnable: false
    steps:
      - uses: actions/checkout@v6
        if: ${{ !env.ACT }}
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Act — checkout tagged tree on bind mount
        if: ${{ env.ACT && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "act build requires a clean worktree" >&2
            git status --short >&2
            exit 1
          fi
          if branch="$(git symbolic-ref -q --short HEAD 2>/dev/null)"; then
            echo "ACT_RESTORE_REF=$branch" >> "$GITHUB_ENV"
          else
            echo "ACT_RESTORE_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          git checkout --detach "${RELEASE_TAG}"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.asset_platform }}

      - name: Install cross
        if: ${{ matrix.builder == 'cross' }}
        shell: bash
        run: cargo install cross --locked --version 0.2.5

      - name: Prepare bundled ripgrep
        if: ${{ matrix.builder != 'windows' && matrix.builder != 'ohos' }}
        shell: bash
        env:
          RG_REPOSITORY: ${{ matrix.rg_repository }}
          RG_TAG: ${{ matrix.rg_tag }}
          RG_ARCHIVE: ${{ matrix.rg_archive }}
          RG_SHA256: ${{ matrix.rg_sha256 }}
          RG_STRIP_COMPONENTS: ${{ matrix.rg_strip_components }}
          RG_RUNNABLE: ${{ matrix.rg_runnable }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${RG_ARCHIVE}"
          bundle_dir="${GITHUB_WORKSPACE}/.build-tools/rg/${ASSET_PLATFORM}"
          url="https://github.com/${RG_REPOSITORY}/releases/download/${RG_TAG}/${RG_ARCHIVE}"

          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 --output "$archive" "$url"
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual_sha256" = "$RG_SHA256"

          mkdir -p "$bundle_dir"
          if [[ "$RG_STRIP_COMPONENTS" == "1" ]]; then
            tar -xzf "$archive" --strip-components=1 -C "$bundle_dir"
          else
            tar -xzf "$archive" -C "$bundle_dir"
          fi
          test -x "$bundle_dir/rg"
          if [[ "$RG_RUNNABLE" == "true" ]]; then
            "$bundle_dir/rg" --version >/dev/null
          fi
          echo "GROW_TOOLS_BUNDLE_RG_PATH=$bundle_dir/rg" >> "$GITHUB_ENV"

      - name: Prepare bundled ripgrep
        if: ${{ matrix.builder == 'windows' }}
        shell: pwsh
        env:
          RG_REPOSITORY: ${{ matrix.rg_repository }}
          RG_TAG: ${{ matrix.rg_tag }}
          RG_ARCHIVE: ${{ matrix.rg_archive }}
          RG_SHA256: ${{ matrix.rg_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP $env:RG_ARCHIVE
          $expanded = Join-Path $env:RUNNER_TEMP "ripgrep-expanded"
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE ".build-tools/rg/$env:ASSET_PLATFORM"
          $url = "https://github.com/$env:RG_REPOSITORY/releases/download/$env:RG_TAG/$env:RG_ARCHIVE"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:RG_SHA256) {
            throw "ripgrep SHA-256 mismatch: expected $env:RG_SHA256, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $expanded
          $rg = Get-ChildItem -Path $expanded -Recurse -Filter rg.exe | Select-Object -First 1
          if (-not $rg) { throw "rg.exe not found in $archive" }
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $bundledRg = Join-Path $bundleDir "rg.exe"
          Copy-Item $rg.FullName $bundledRg
          & $bundledRg --version | Out-Null
          "GROW_TOOLS_BUNDLE_RG_PATH=$bundledRg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Grow (AlmaLinux 8, glibc 2.28 baseline)
        if: ${{ matrix.builder == 'alma' }}
        shell: bash
        env:
          GROW_TOOLS_BUNDLE_RG_SKIP_EXEC_CHECK: "1"
        run: |
          set -euo pipefail
          CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${CARGO_HOME}:${CARGO_HOME}" -v "${RUSTUP_HOME}:${RUSTUP_HOME}" \
            -e "PATH=${CARGO_HOME}/bin:${PATH}" \
            -e "HOME=${HOME}" -e "HOST_UID=${HOST_UID}" -e "HOST_GID=${HOST_GID}" \
            -e "CARGO_HOME=${CARGO_HOME}" -e "RUSTUP_HOME=${RUSTUP_HOME}" \
            -e "GROW_VERSION=${GROW_VERSION}" \
            -e "GROW_TOOLS_BUNDLE_RG_PATH=${GROW_TOOLS_BUNDLE_RG_PATH}" \
            -e "GROW_TOOLS_BUNDLE_RG_SKIP_EXEC_CHECK=1" \
            -e "TARGET_TRIPLE=${TARGET_TRIPLE}" -e "CARGO_INCREMENTAL=0" \
            almalinux:8 bash -euo pipefail -c '
              dnf install -y gcc gcc-c++ make cmake git perl pkgconf util-linux >/dev/null
              setpriv --reuid="${HOST_UID}" --regid="${HOST_GID}" --clear-groups \
                cargo build --locked --profile release-dist \
                -p cli --bin grow --target "${TARGET_TRIPLE}"
            '

      - name: Build Grow (cross)
        if: ${{ matrix.builder == 'cross' }}
        shell: bash
        run: |
          set -euo pipefail
          export CROSS_CONTAINER_OPTS="-v ${GITHUB_WORKSPACE}/.build-tools:/opt/tools:ro -e GROW_VERSION=${GROW_VERSION} -e GROW_TOOLS_BUNDLE_RG_PATH=/opt/tools/rg/${ASSET_PLATFORM}/rg -e GROW_TOOLS_BUNDLE_RG_SKIP_EXEC_CHECK=1"
          cross build --locked --profile release-dist \
            -p cli --bin grow --target "${TARGET_TRIPLE}"

      - name: Build Grow (macOS)
        if: ${{ matrix.builder == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --profile release-dist \
            -p cli --bin grow --target "${TARGET_TRIPLE}"

      - name: Build Grow (Windows)
        if: ${{ matrix.builder == 'windows' }}
        shell: pwsh
        run: cargo build --locked --profile release-dist -p cli --bin grow --target $env:TARGET_TRIPLE

      # OpenHarmony build: runs scripts/build-ohos.sh inside the Harmonybrew
      # ci-runner container (arm64 OHOS userland with ohos-sdk + brew rust).
      # The script bootstraps the toolchain and installs the rsproxy cargo
      # mirror (crates.io/USTC TLS is flaky), then builds with jemalloc off
      # (its configure does not know the ohos triplet) and WITHOUT a bundled
      # ripgrep (runtime resolves `rg` from PATH; search tools error with an
      # install hint when missing). CARGO_TARGET_DIR lives under the mounted
      # workspace so the runner can package the artifact. The binary is
      # stripped with the SDK's llvm-strip and smoke-tested inside the
      # container (it cannot run on the ubuntu runner).
      - name: Build Grow (OHOS container)
        if: ${{ matrix.builder == 'ohos' }}
        shell: bash
        env:
          GROW_VERSION: ${{ needs.validate.outputs.version }}
          CI_RUNNER: swr.cn-north-4.myhuaweicloud.com/harmonybrew/ci-runner:latest
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace/grow" -w /workspace/grow \
            -e "GROW_VERSION=${GROW_VERSION}" \
            -e "CARGO_PROFILE=release-dist" \
            -e "CARGO_TARGET_DIR=/workspace/grow/target-ohos" \
            "${CI_RUNNER}" sh -euo pipefail -c '
              scripts/build-ohos.sh
              BIN="${CARGO_TARGET_DIR}/${CARGO_PROFILE}/grow"
              test -x "$BIN"
              /opt/ohos-sdk/ohos/native/llvm/bin/llvm-strip --strip-all "$BIN"
              scripts/build-ohos.sh --smoke
            '
      - name: Smoke-test native binary
        if: ${{ matrix.smoke && matrix.builder != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${TARGET_TRIPLE}/release-dist/grow"
          test -x "$bin"
          test -s "$bin"
          "$bin" --version | tee /dev/stderr | grep -F "${GROW_VERSION}"

      - name: Smoke-test native binary
        if: ${{ matrix.smoke && matrix.builder == 'windows' }}
        shell: pwsh
        run: |
          $bin = "target/$env:TARGET_TRIPLE/release-dist/grow.exe"
          if (-not (Test-Path $bin)) { throw "missing $bin" }
          $version = & $bin --version
          if ($version -notlike "*$env:GROW_VERSION*") { throw "unexpected version: $version" }

      - name: Package Unix release asset
        if: ${{ matrix.builder != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          stage_dir="$(mktemp -d "${RUNNER_TEMP}/grow-release.XXXXXX")"
          trap 'rm -rf "$stage_dir"' EXIT
          # OHOS builds into target-ohos (container CARGO_TARGET_DIR under the
          # workspace); all other builders use target/${TARGET_TRIPLE}.
          if [[ "${{ matrix.builder }}" == "ohos" ]]; then
            bin_path="target-ohos/release-dist/grow"
          else
            bin_path="target/${TARGET_TRIPLE}/release-dist/grow"
          fi
          cp "$bin_path" "$stage_dir/grow"

          case "${{ matrix.builder }}" in
            alma)
              strip --strip-all "$stage_dir/grow"
              ;;
            cross)
              strip_bin="$(command -v llvm-strip || command -v llvm-strip-18 || true)"
              test -n "$strip_bin" || { echo "llvm-strip not found" >&2; exit 1; }
              "$strip_bin" --strip-all "$stage_dir/grow"
              ;;
            macos)
              strip "$stage_dir/grow"
              ;;
            ohos)
              : # already stripped in-container by the build step
              ;;
          esac

          asset="dist/grow-${GROW_VERSION}-${ASSET_PLATFORM}.tar.gz"
          COPYFILE_DISABLE=1 tar -C "$stage_dir" -czf "$asset" grow
          test "$(tar -tzf "$asset")" = "grow"
          ls -la "$asset"

      - name: Package Windows release asset
        if: ${{ matrix.builder == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stageDir = Join-Path $env:RUNNER_TEMP "grow-release"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "target/$env:TARGET_TRIPLE/release-dist/grow.exe" (Join-Path $stageDir "grow.exe")
          $asset = "dist/grow-$env:GROW_VERSION-$env:ASSET_PLATFORM.tar.gz"
          tar -C $stageDir -czf $asset grow.exe
          $entries = (tar -tzf $asset).Trim()
          if ($entries -ne "grow.exe") { throw "invalid archive entry: $entries" }
          Get-Item $asset

      - uses: actions/upload-artifact@v7
        with:
          name: grow-${{ matrix.asset_platform }}
          path: dist/grow-*
          if-no-files-found: error
          retention-days: 3

      - name: Act — restore bind-mounted branch
        if: ${{ always() && env.ACT && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACT_RESTORE_REF:-}" ]]; then
            git checkout -f "${ACT_RESTORE_REF}"
          fi

  publish:
    name: Publish release assets
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: grow-*
          path: dist
          merge-multiple: true

      - name: Verify staged binaries
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          required=(
            "grow-${version}-linux-x86_64.tar.gz"
            "grow-${version}-linux-aarch64.tar.gz"
            "grow-${version}-linux-riscv64.tar.gz"
            "grow-${version}-linux-x86_64-musl.tar.gz"
            "grow-${version}-linux-aarch64-musl.tar.gz"
            "grow-${version}-macos-aarch64.tar.gz"
            "grow-${version}-macos-x86_64.tar.gz"
            "grow-${version}-windows-x86_64.tar.gz"
            "grow-${version}-windows-aarch64.tar.gz"
            "grow-${version}-ohos-aarch64.tar.gz"
          )
          mapfile -t assets < <(find . -maxdepth 1 -type f -name 'grow-*' -printf '%f\n' | sort)

          if [[ "${ACT:-}" != "true" ]]; then
            test "${#assets[@]}" -eq "${#required[@]}"
            for name in "${required[@]}"; do
              test -s "$name"
            done
          else
            test "${#assets[@]}" -ge 1
          fi

          for name in "${assets[@]}"; do
            known=false
            for required_name in "${required[@]}"; do
              if [[ "$name" == "$required_name" ]]; then
                known=true
                break
              fi
            done
            [[ "$known" == "true" ]] || {
              echo "asset name is outside the updater contract: $name" >&2
              exit 1
            }
            expected_entry=grow
            if [[ "$name" == *-windows-*.tar.gz ]]; then
              expected_entry=grow.exe
            fi
            if [[ "$(tar -tzf "$name")" != "$expected_entry" ]]; then
              echo "$name must contain exactly one $expected_entry executable" >&2
              exit 1
            fi
            echo "release asset: $name ($(wc -c <"$name") bytes)"
          done
          sha256sum grow-*

      - name: Prepare hidden GitHub Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          expected_prerelease=false
          if [[ "$version" == *-* ]]; then
            expected_prerelease=true
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft
            fi
          else
            release_args=(--verify-tag --draft --title "$RELEASE_TAG" --generate-notes)
            if [[ "$expected_prerelease" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          fi

          actual_prerelease="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')"
          if [[ "$actual_prerelease" != "$expected_prerelease" ]]; then
            gh release edit "$RELEASE_TAG" --prerelease="$expected_prerelease"
          fi

      - name: Upload Grow binaries
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/grow-* --clobber

      - name: Verify and publish GitHub Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          required=(
            "grow-${version}-linux-x86_64.tar.gz"
            "grow-${version}-linux-aarch64.tar.gz"
            "grow-${version}-linux-riscv64.tar.gz"
            "grow-${version}-linux-x86_64-musl.tar.gz"
            "grow-${version}-linux-aarch64-musl.tar.gz"
            "grow-${version}-macos-aarch64.tar.gz"
            "grow-${version}-macos-x86_64.tar.gz"
            "grow-${version}-windows-x86_64.tar.gz"
            "grow-${version}-windows-aarch64.tar.gz"
            "grow-${version}-ohos-aarch64.tar.gz"
          )
          remote_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          remote_asset_count="$(sed '/^$/d' <<<"$remote_assets" | wc -l | tr -d ' ')"
          if [[ "$remote_asset_count" -ne "${#required[@]}" ]]; then
            echo "Release must contain exactly ${#required[@]} updater assets; found $remote_asset_count" >&2
            printf '%s\n' "$remote_assets" >&2
            exit 1
          fi
          for name in "${required[@]}"; do
            grep -Fqx "$name" <<<"$remote_assets" || {
              echo "Release is missing updater asset: $name" >&2
              exit 1
            }
          done
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

      - name: Act dry-run summary
        if: ${{ env.ACT }}
        working-directory: dist
        shell: bash
        run: ls -la grow-*
