name: Windows session storage

on:
  workflow_dispatch:
    inputs:
      api_probe_only:
        description: Run the isolated Win32 rename diagnostic without compiling Grow
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/windows-session-storage.yml"
      - "crates/codegen/shell/src/session/storage/**"
      - "crates/codegen/shell/src/session/persistence.rs"
      - "crates/codegen/shell/src/session/input_inbox.rs"
      - "crates/codegen/chat-state/**"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: windows-session-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rename-api-probe:
    if: ${{ inputs.api_probe_only }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - run: python openspec/changes/fix-windows-coordination-release-regressions/rename-api-probe.py
  session-creation:
    if: ${{ !inputs.api_probe_only }}
    name: Create and reopen a session
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-session-storage
          cache-on-failure: true

      - name: Exercise the complete session creation boundary
        shell: pwsh
        run: |
          $tests = @(
            "session::storage::jsonl::tests::session_creation_round_trip_commits_and_reopens_the_timeline",
            "session::storage::jsonl::tests::long_windows_cwds_roundtrip_under_long_storage_root",
            "session::storage::jsonl::tests::scan_opened_sessions_skips_non_sessions_and_invalid_summaries",
            "session::storage::tests::contained_no_replace_rename_preserves_both_existing_entities",
            "session::storage::tests::pinned_child_capability_publishes_without_reopening_source",
            "session::input_inbox::tests::long_profile_payload_round_trip_preserves_immutable_artifacts"
          )
          foreach ($test in $tests) {
            cargo test --locked -p shell --lib $test -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { throw "Storage regression failed: $test" }
          }
