name: Local agent coordination

on:
  workflow_call:
    inputs:
      commit:
        description: Immutable commit to test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      process_only:
        description: Rerun CLI process regression after unchanged library tests have passed
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "crates/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "crates/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: local-coordination-${{ github.workflow }}-${{ inputs.commit || github.sha }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: "off"
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: "off"
      EXPECTED_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Verify immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected a full immutable commit SHA, found: $EXPECTED_COMMIT" >&2
            exit 1
          }
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_COMMIT" ]] || {
            echo "checked out $actual but expected $EXPECTED_COMMIT" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test the exact Cargo regression runner
        run: python -m unittest discover -s scripts/tests
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: local-coordination
          cache-on-failure: true
      - if: ${{ !inputs.process_only }}
        run: cargo test --locked -p shell --lib local_ipc -- --nocapture
      - if: ${{ !inputs.process_only }}
        run: cargo test --locked -p shell --lib coordination -- --nocapture
      - if: ${{ !inputs.process_only }}
        run: cargo test --locked -p pager --lib coordination -- --nocapture
      - if: ${{ !inputs.process_only }}
        run: cargo test --locked -p pager-minimal --lib coordination -- --nocapture
      - if: ${{ !inputs.process_only }}
        name: Run cross-platform production transcript export tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_exact_cargo_test.py --package pager --lib export_cmd::tests::tree_export_keeps_parent_and_child_conversations_separate
          python scripts/run_exact_cargo_test.py --package pager --lib export_cmd::tests::directory_sync_skips_only_unsupported_directory_handles
          python scripts/run_exact_cargo_test.py --package pager --lib trajectory_cmd::tests::transcript_download_http_uses_production_export_archive
      - name: Build coordination CLI
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # RUST_MIN_STACK does not size the native main thread. Keep this
            # allowance local to the unoptimized regression executable.
            cargo rustc --locked -p cli --bin grow -- -C link-arg=/STACK:33554432
          else
            cargo build --locked -p cli --bin grow
          fi
      - name: Real independent process regression
        shell: bash
        run: |
          binary=target/debug/grow
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary=target/debug/grow.exe; fi
          python scripts/test_local_coordination.py --binary "$binary"
